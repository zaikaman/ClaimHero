name: CD - Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-Flight Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund --progress=false

      - name: Run Full Quality Verification
        run: npm run verify

  deploy:
    name: Deploy Backend & Static Hosting
    runs-on: ubuntu-latest
    needs: [verify]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund --progress=false

      - name: Deploy to Convex Static Hosting
        id: convex_deploy
        run: npm run deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://kindhearted-elephant-992.convex.cloud' }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL || 'https://kindhearted-elephant-992.convex.site' }}
          VITE_AGENTMAIL_SENDER_EMAIL: ${{ vars.VITE_AGENTMAIL_SENDER_EMAIL || 'claimhero-sender@agentmail.to' }}
          VITE_AGENTMAIL_ADJUDICATOR_EMAIL: ${{ vars.VITE_AGENTMAIL_ADJUDICATOR_EMAIL || 'claimhero-adjudicator@agentmail.to' }}
          VITE_AGENTMAIL_INTAKE_EMAIL: ${{ vars.VITE_AGENTMAIL_INTAKE_EMAIL || 'claimhero-intake@agentmail.to' }}

      - name: Post-Deploy Smoke Test
        run: |
          echo "Running synthetic health check against live deployment..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://kindhearted-elephant-992.convex.site" || echo "000")
          echo "Received HTTP status code: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed: expected HTTP 200 from https://kindhearted-elephant-992.convex.site, got $STATUS_CODE"
            exit 1
          fi
          echo "Smoke test passed successfully."

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gate**: 161/161 unit tests passed with 100% line coverage" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Application**: [https://kindhearted-elephant-992.convex.site](https://kindhearted-elephant-992.convex.site)" >> $GITHUB_STEP_SUMMARY
          echo "- **Convex Cloud Backend**: [https://kindhearted-elephant-992.convex.cloud](https://kindhearted-elephant-992.convex.cloud)" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
